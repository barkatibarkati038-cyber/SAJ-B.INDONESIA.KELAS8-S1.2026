            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          );
        case "edit":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
          );
        default:
          return null;
      }
    };

    // =========================================================================
    // ALGORITMA FISHER-YATES SHUFFLE
    // =========================================================================
    function fisherYatesShuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function prepareShuffledQuestions(questions) {
      const shuffledQs = fisherYatesShuffle(questions);
      return shuffledQs.map((q) => {
        if ((q.type === "mc" || q.type === "mc_complex") && Array.isArray(q.options)) {
          return {
            ...q,
            options: fisherYatesShuffle(q.options)
          };
        }
        return { ...q };
      });
    }

    // =========================================================================
    // KOMPONEN CUSTOM MODAL (DI LUAR APP UNTUK ANTI-FLICKER)
    // =========================================================================
    const AlertModal = ({ isOpen, title, message, buttonText, onClose, variant = "danger" }) => {
      if (!isOpen) return null;
      const isDanger = variant === "danger";

      return (
        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200 animate-fade-in">
            <div className={`px-6 py-4 flex items-center gap-3 text-white ${isDanger ? "bg-gradient-to-r from-red-600 to-rose-700" : "bg-gradient-to-r from-cyan-600 to-blue-700"}`}>
              <Icon name="alert" className="w-7 h-7 flex-shrink-0" />
              <h3 className="text-lg font-bold tracking-wide">{title}</h3>
            </div>
            <div className="p-6">
              <p className="text-slate-700 text-sm sm:text-base leading-relaxed whitespace-pre-line">{message}</p>
              <div className="mt-6 flex justify-end">
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-5 py-2.5 rounded-xl font-semibold text-white shadow-md transition active:scale-95 ${
                    isDanger
                      ? "bg-red-600 hover:bg-red-700"
                      : "bg-cyan-600 hover:bg-cyan-700"
                  }`}
                >
                  {buttonText || "Saya Mengerti"}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const ConfirmModal = ({
      isOpen,
      title,
      message,
      unansweredCount,
      onConfirm,
      onCancel,
      confirmText = "Ya, Kumpulkan Ujian",
      cancelText = "Periksa Kembali"
    }) => {
      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
            <div className="bg-gradient-to-r from-cyan-600 to-blue-700 px-6 py-4 flex items-center gap-3 text-white">
              <Icon name="check" className="w-7 h-7 flex-shrink-0" />
              <h3 className="text-lg font-bold">{title}</h3>
            </div>
            <div className="p-6">
              <p className="text-slate-700 text-sm sm:text-base leading-relaxed">{message}</p>
              {typeof unansweredCount === "number" && unansweredCount > 0 && (
                <div className="mt-3 p-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-800 text-sm flex items-start gap-2">
                  <Icon name="alert" className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" />
                  <span>
                    Perhatian: Masih ada <strong>{unansweredCount} soal</strong> yang belum dijawab. Yakin ingin mengumpulkan sekarang?
                  </span>
                </div>
              )}
              <div className="mt-6 flex flex-col sm:flex-row justify-end gap-3">
                <button
                  type="button"
                  onClick={onCancel}
                  className="px-4 py-2.5 rounded-xl font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition"
                >
                  {cancelText}
                </button>
                <button
                  type="button"
                  onClick={onConfirm}
                  className="px-5 py-2.5 rounded-xl font-semibold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 shadow-md transition active:scale-95"
                >
                  {confirmText}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // HELPER FORMAT WAKTU & TANGGAL
    // =========================================================================
    function getTodayDateString() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatTime(totalSeconds) {
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      if (hrs > 0) {
        return `${String(hrs).padStart(2, "0")}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      }
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function isQuestionAnswered(question, answerValue) {
      if (answerValue === undefined || answerValue === null) return false;
      if (question.type === "mc_complex") {
        return Array.isArray(answerValue) && answerValue.length > 0;
      }
      return String(answerValue).trim().length > 0;
    }

    // =========================================================================
    // KOMPONEN UTAMA APLIKASI CBT
    // =========================================================================
    function App() {
      // Status aplikasi: 'login' | 'resume_prompt' | 'exam' | 'finished'
      const [screen, setScreen] = useState("login");

      // Data Identitas Siswa
      const [studentInfo, setStudentInfo] = useState({
        nama: "",
        kelas: "",
        tanggal: getTodayDateString()
      });
      const [loginError, setLoginError] = useState("");

      // Data Ujian
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(EXAM_CONFIG.durationMinutes * 60);
      const [violations, setViolations] = useState(0);

      // Data Sesi Tersimpan (LocalStorage)
      const [savedSessionData, setSavedSessionData] = useState(null);

      // State Modal (Anti-Flicker)
      const [alertModal, setAlertModal] = useState({
        isOpen: false,
        title: "",
        message: "",
        buttonText: "Saya Mengerti",
        variant: "danger"
      });
      const [confirmModal, setConfirmModal] = useState({
        isOpen: false,
        type: "submit" // 'submit' | 'reset'
      });

      // Hasil Akhir Setelah Submit
      const [examResult, setExamResult] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);

      // Refs untuk menghindari race condition & false positive anti-cheat
      const isSubmittingRef = useRef(false);
      const examStartGraceRef = useRef(0);
      const lastViolationTimeRef = useRef(0);
      const latestStateRef = useRef({
        studentInfo,
        questions,
        answers,
        violations
      });

      useEffect(() => {
        latestStateRef.current = { studentInfo, questions, answers, violations };
      }, [studentInfo, questions, answers, violations]);

      // -----------------------------------------------------------------------
      // 1. CEK SESI TERSIMPAN DI LOCALSTORAGE SAAT PERTAMA DIMUAT
      // -----------------------------------------------------------------------
      useEffect(() => {
        try {
          const raw = localStorage.getItem(EXAM_CONFIG.storageKey);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (
              parsed &&
              parsed.studentInfo &&
              Array.isArray(parsed.questions) &&
              parsed.questions.length > 0 &&
              typeof parsed.timeLeft === "number" &&
              parsed.timeLeft > 0
            ) {
              setSavedSessionData(parsed);
              setScreen("resume_prompt");
            } else {
              localStorage.removeItem(EXAM_CONFIG.storageKey);
            }
          }
        } catch (err) {
          localStorage.removeItem(EXAM_CONFIG.storageKey);
        }
      }, []);

      // -----------------------------------------------------------------------
      // 2. AUTO-SAVE REAL-TIME KE LOCALSTORAGE SAAT UJIAN BERLANGSUNG
      // -----------------------------------------------------------------------
      useEffect(() => {
        if (screen !== "exam" || isSubmittingRef.current) return;
        try {
          const sessionPayload = {
            studentInfo,
            questions,
            currentIndex,
            answers,
            timeLeft,
            violations,
            updatedAt: new Date().toISOString()
          };
          localStorage.setItem(EXAM_CONFIG.storageKey, JSON.stringify(sessionPayload));
        } catch (e) {
          // Abaikan jika storage penuh
        }
      }, [screen, studentInfo, questions, currentIndex, answers, timeLeft, violations]);

      // -----------------------------------------------------------------------
      // 3. FUNGSI PENILAIAN, REKAP RUNTUT & KIRIM DATA KE GOOGLE SHEETS
      // -----------------------------------------------------------------------
      const finalizeAndSubmitExam = useCallback(async (completionReason, overrideViolations = null) => {
        if (isSubmittingRef.current) return;
        isSubmittingRef.current = true;
        setIsSubmitting(true);
        setConfirmModal({ isOpen: false, type: "submit" });

        const {
          studentInfo: curStudent,
          questions: curQuestions,
          answers: curAnswers,
          violations: curViolations
        } = latestStateRef.current;

        const finalViolations = overrideViolations !== null ? overrideViolations : curViolations;

        // Urutkan kembali soal berdasarkan ID asli (1 sampai N)
        const sortedQuestions = [...curQuestions].sort((a, b) => a.id - b.id);

        let pgCorrect = 0;
        let pgTotal = 0;
        let pgPointsEarned = 0;
        let pgPointsMax = 0;
        let shortCount = 0;
        let essayCount = 0;
        let manualAnsweredCount = 0;

        const detailParts = sortedQuestions.map((q) => {
          const rawAns = curAnswers[q.id];

          if (q.type === "mc") {
            pgTotal += 1;
            const pts = q.points || 2;
            pgPointsMax += pts;

            if (!rawAns || String(rawAns).trim() === "") {
              return `Soal ${q.id}: KOSONG`;
            }
            if (rawAns === q.answer) {
              pgCorrect += 1;
              pgPointsEarned += pts;
              return `Soal ${q.id}: BENAR`;
            } else {
              return `Soal ${q.id}: SALAH (Pilih: ${rawAns}, Kunci: ${q.answer})`;
            }
          } else if (q.type === "mc_complex") {
            pgTotal += 1;
            const pts = q.points || 2;
            pgPointsMax += pts;
            const selectedArr = Array.isArray(rawAns) ? [...rawAns].sort() : [];
            const correctArr = Array.isArray(q.answer) ? [...q.answer].sort() : [];

            if (selectedArr.length === 0) {
              return `Soal ${q.id}: KOSONG`;
            }
            const isMatch =
              selectedArr.length === correctArr.length &&
              selectedArr.every((val, idx) => val === correctArr[idx]);
            if (isMatch) {
              pgCorrect += 1;
              pgPointsEarned += pts;
              return `Soal ${q.id}: BENAR`;
            } else {
              return `Soal ${q.id}: SALAH (Pilih: ${selectedArr.join(",")}, Kunci: ${correctArr.join(",")})`;
            }
          } else if (q.type === "short") {
            shortCount += 1;
            const textAns = rawAns ? String(rawAns).trim() : "";
            if (textAns.length > 0) {
              manualAnsweredCount += 1;
              return `Soal ${q.id} [Isian - Diperiksa Guru]: ${textAns}`;
            }
            return `Soal ${q.id} [Isian - Diperiksa Guru]: KOSONG`;
          } else {
            // essay
            essayCount += 1;
            const textAns = rawAns ? String(rawAns).trim() : "";
            if (textAns.length > 0) {
              manualAnsweredCount += 1;
              return `Soal ${q.id} [Esai - Diperiksa Guru]: ${textAns}`;
            }
            return `Soal ${q.id} [Esai - Diperiksa Guru]: KOSONG`;
          }
        });

        const rincianJawaban = detailParts.join(" | ");
        const pgScoreScale100 = pgTotal > 0 ? Math.round((pgCorrect / pgTotal) * 100) : 0;

        // Format skor untuk Google Sheets yang jelas bagi guru
        const skorSummaryForSheet = `${pgPointsEarned}/${pgPointsMax} Poin PG (Skala PG: ${pgScoreScale100}/100) + Isian/Esai Diperiksa Guru`;

        const payload = {
          nama: curStudent.nama,
          kelas: curStudent.kelas,
          tanggal: curStudent.tanggal,
          skor: skorSummaryForSheet,
          pelanggaran: finalViolations,
          keterangan: completionReason,
          rincianJawaban: rincianJawaban
        };

        let serverStatus = "Terkirim ke Server Google Sheets";
        try {
          if (GOOGLE_SHEETS_WEB_APP_URL && GOOGLE_SHEETS_WEB_APP_URL !== "URL_APPS_SCRIPT_ANDA") {
            await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
              method: "POST",
              mode: "no-cors",
              headers: {
                "Content-Type": "text/plain"
              },
              body: JSON.stringify(payload)
            });
          } else {
            serverStatus = "Mode Lokal (URL Apps Script belum diisi)";
          }
        } catch (err) {
          serverStatus = "Gagal terhubung ke server (Cek koneksi internet)";
        }

        // Hapus data LocalStorage setelah ujian disubmit
        try {
          localStorage.removeItem(EXAM_CONFIG.storageKey);
        } catch (e) {}

        // Keluar dari fullscreen dengan aman saat selesai
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }

        setExamResult({
          studentInfo: curStudent,
          pgCorrect,
          pgTotal,
          pgPointsEarned,
          pgPointsMax,
          pgScoreScale100,
          shortCount,
          essayCount,
          manualAnsweredCount,
          violations: finalViolations,
          completionReason,
          serverStatus
        });

        setIsSubmitting(false);
        setScreen("finished");
      }, []);

      // -----------------------------------------------------------------------
      // 4. TIMER HITUNG MUNDUR OTOMATIS
      // -----------------------------------------------------------------------
      useEffect(() => {
        if (screen !== "exam") return;

        const timerId = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timerId);
              setAlertModal({
                isOpen: true,
                title: "Waktu Ujian Telah Habis!",
                message: "Waktu pengerjaan 90 menit telah berakhir. Sistem otomatis mengunci dan mengumpulkan seluruh jawaban Anda.",
                buttonText: "Lihat Rekap Hasil",
                variant: "danger"
              });
              finalizeAndSubmitExam("Auto-Submit (Waktu Ujian Habis)");
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timerId);
      }, [screen, finalizeAndSubmitExam]);

      // -----------------------------------------------------------------------
      // 5. KEAMANAN & STRICT ANTI-CHEAT (VISIBILITY, FULLSCREEN, COPY/PASTE)
      // -----------------------------------------------------------------------
      const triggerViolation = useCallback(
        (reasonText) => {
          if (screen !== "exam" || isSubmittingRef.current) return;

          const now = Date.now();
          // Grace period 1.5 detik setelah mulai/lanjut ujian
          if (now - examStartGraceRef.current < 1500) return;
          // Debounce agar 1 aksi (misal Alt+Tab) tidak terhitung ganda oleh visibility + fullscreen
          if (now - lastViolationTimeRef.current < 1200) return;
          lastViolationTimeRef.current = now;

          setViolations((prev) => {
            const nextCount = prev + 1;
            if (nextCount === 1) {
              setAlertModal({
                isOpen: true,
                title: "PERINGATAN KERAS PELANGGARAN (1/2)",
                message: `Sistem mendeteksi aktivitas mencurigakan: ${reasonText}.\n\nIni adalah peringatan pertama dan terakhir. Jika Anda keluar dari layar penuh atau berpindah tab sekali lagi, ujian akan otomatis dikunci dan dikumpulkan!`,
                buttonText: "Kembali ke Mode Fullscreen",
                variant: "danger"
              });
            } else if (nextCount >= 2) {
              setAlertModal({
                isOpen: true,
                title: "UJIAN DIKUNCI OTOMATIS (PELANGGARAN KE-2)",
                message: `Anda melakukan pelanggaran kedua (${reasonText}). Lembar ujian telah dikunci dan jawaban Anda otomatis dikirim ke server.`,
                buttonText: "Lihat Status Pengumpulan",
                variant: "danger"
              });
              finalizeAndSubmitExam(`Auto-Submit (Pelanggaran Anti-Cheat ke-${nextCount}: ${reasonText})`, nextCount);
            }
            return nextCount;
          });
        },
        [screen, finalizeAndSubmitExam]
      );

      useEffect(() => {
        if (screen !== "exam") return;

        const handleVisibilityChange = () => {
          if (document.hidden) {
            triggerViolation("Berpindah tab atau meminimalkan browser");
          }
        };

        const handleFullscreenChange = () => {
          if (!document.fullscreenElement) {
            triggerViolation("Keluar dari mode layar penuh (Fullscreen)");
          }
        };

        const handleContextMenu = (e) => {
          e.preventDefault();
        };

        const handleCopyCutPaste = (e) => {
          e.preventDefault();
        };

        const handleKeyDown = (e) => {
          if (
            (e.ctrlKey || e.metaKey) &&
            ["c", "v", "x", "u", "s", "p", "a"].includes(e.key.toLowerCase())
          ) {
            // Izinkan Ctrl+A hanya di dalam input/textarea
            if (
              e.key.toLowerCase() === "a" &&
              (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")
            ) {
              return;
            }
            e.preventDefault();
          }
          if (e.key === "F12") {
            e.preventDefault();
          }
        };

        document.addEventListener("visibilitychange", handleVisibilityChange);
        document.addEventListener("fullscreenchange", handleFullscreenChange);
        document.addEventListener("contextmenu", handleContextMenu);
        document.addEventListener("copy", handleCopyCutPaste);
        document.addEventListener("cut", handleCopyCutPaste);
        document.addEventListener("paste", handleCopyCutPaste);
        document.addEventListener("keydown", handleKeyDown);

        return () => {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          document.removeEventListener("fullscreenchange", handleFullscreenChange);
          document.removeEventListener("contextmenu", handleContextMenu);
          document.removeEventListener("copy", handleCopyCutPaste);
          document.removeEventListener("cut", handleCopyCutPaste);
          document.removeEventListener("paste", handleCopyCutPaste);
          document.removeEventListener("keydown", handleKeyDown);
        };
      }, [screen, triggerViolation]);

      // -----------------------------------------------------------------------
      // 6. HANDLER AKSI SISWA
      // -----------------------------------------------------------------------
      const requestBrowserFullscreen = () => {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      };

      const handleStartNewExam = (e) => {
        e.preventDefault();
        if (!studentInfo.nama.trim() || !studentInfo.kelas.trim() || !studentInfo.tanggal) {
          setLoginError("Harap lengkapi Nama Lengkap, Kelas, dan Tanggal Ujian terlebih dahulu.");
          return;
        }
        setLoginError("");
        isSubmittingRef.current = false;
        examStartGraceRef.current = Date.now();
        requestBrowserFullscreen();

        const randomized = prepareShuffledQuestions(rawQuestionsData);
        setQuestions(randomized);
        setCurrentIndex(0);
        setAnswers({});
        setTimeLeft(EXAM_CONFIG.durationMinutes * 60);
        setViolations(0);
        setScreen("exam");
      };

      const handleResumeSession = () => {
        if (!savedSessionData) return;
        isSubmittingRef.current = false;
        examStartGraceRef.current = Date.now();
        requestBrowserFullscreen();

        setStudentInfo(savedSessionData.studentInfo);
        setQuestions(savedSessionData.questions);
        setCurrentIndex(savedSessionData.currentIndex || 0);
        setAnswers(savedSessionData.answers || {});
        setTimeLeft(savedSessionData.timeLeft);
        setViolations(savedSessionData.violations || 0);
        setSavedSessionData(null);
        setScreen("exam");
      };

      const handleResetSavedSession = () => {
        try {
          localStorage.removeItem(EXAM_CONFIG.storageKey);
        } catch (e) {}
        setSavedSessionData(null);
        setConfirmModal({ isOpen: false, type: "submit" });
        setScreen("login");
      };

      const handleAnswerChange = (questionId, value) => {
        setAnswers((prev) => ({
          ...prev,
          [questionId]: value
        }));
      };

      const handleComplexToggle = (questionId, optionKey) => {
        setAnswers((prev) => {
          const existing = Array.isArray(prev[questionId]) ? prev[questionId] : [];
          const updated = existing.includes(optionKey)
            ? existing.filter((k) => k !== optionKey)
            : [...existing, optionKey];
          return {
            ...prev,
            [questionId]: updated
          };
        });
      };

      const handleCloseAlertModal = () => {
        setAlertModal((prev) => ({ ...prev, isOpen: false }));
        if (screen === "exam" && !isSubmittingRef.current && !document.fullscreenElement) {
          examStartGraceRef.current = Date.now();
          requestBrowserFullscreen();
        }
      };

      const openSubmitConfirmation = () => {
        setConfirmModal({ isOpen: true, type: "submit" });
      };

      // =======================================================================
      // RENDER HEADER UTAMA APLIKASI
      // =======================================================================
      const renderHeader = (showExamStats = false) => {
        const isTimeCritical = timeLeft <= 300; // <= 5 menit
        return (
          <header className="bg-gradient-to-r from-cyan-600 via-sky-700 to-blue-800 text-white shadow-lg border-b border-cyan-400/30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
              <div className="flex items-center gap-3.5">
                <div className="p-2.5 bg-white/15 backdrop-blur-sm rounded-xl border border-white/25 shadow-inner">
                  <Icon name="book" className="w-7 h-7 text-cyan-100" />
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-white">
                    {EXAM_CONFIG.subject}
                  </h1>
                  <p className="text-xs sm:text-sm font-medium text-cyan-100 tracking-wide">
                    {EXAM_CONFIG.examType} &bull; KELAS {EXAM_CONFIG.grade}
                  </p>
                </div>
              </div>

              {showExamStats && (
                <div className="flex flex-wrap items-center gap-3">
                  {/* Info Siswa */}
                  <div className="bg-white/10 backdrop-blur-sm px-3.5 py-2 rounded-xl border border-white/20 text-xs sm:text-sm">
                    <div className="font-bold text-white truncate max-w-[180px]">{studentInfo.nama}</div>
                    <div className="text-cyan-100 text-xs">Kelas: {studentInfo.kelas}</div>
                  </div>

                  {/* Indikator Pelanggaran */}
                  <div
                    className={`px-3.5 py-2 rounded-xl border text-xs sm:text-sm font-semibold flex items-center gap-2 ${
                      violations > 0
                        ? "bg-red-500/90 border-red-300 text-white animate-pulse"
                        : "bg-white/10 border-white/20 text-cyan-50"
                    }`}
                  >
                    <Icon name="shield" className="w-4 h-4" />
                    <span>Pelanggaran: {violations}/2</span>
                  </div>

                  {/* Timer Hitung Mundur */}
                  <div
                    className={`px-4 py-2 rounded-xl border font-mono text-base sm:text-lg font-extrabold flex items-center gap-2 shadow-md ${
                      isTimeCritical
                        ? "bg-red-600 border-red-300 text-white animate-pulse"
                        : "bg-slate-900/40 border-cyan-300/40 text-cyan-50"
                    }`}
                  >
                    <Icon name="clock" className="w-5 h-5 text-cyan-200" />
                    <span>{formatTime(timeLeft)}</span>
                  </div>
                </div>
              )}
            </div>
          </header>
        );
      };

      // =======================================================================
      // TAMPILAN 1: PROMPT PEMULIHAN SESI LOCALSTORAGE
      // =======================================================================
      if (screen === "resume_prompt" && savedSessionData) {
        const answeredCount = savedSessionData.questions.filter((q) =>
          isQuestionAnswered(q, savedSessionData.answers?.[q.id])
        ).length;

        return (
          <div className="min-h-screen flex flex-col">
            {renderHeader(false)}
            <main className="flex-1 flex items-center justify-center p-4">
              <div className="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-cyan-200">
                <div className="bg-gradient-to-r from-amber-500 to-orange-600 px-6 py-4 text-white flex items-center gap-3">
                  <Icon name="refresh" className="w-7 h-7" />
                  <div>
                    <h2 className="text-lg font-bold">Sesi Ujian Tersimpan Ditemukan!</h2>
                    <p className="text-xs text-amber-100">Progres pengerjaan sebelumnya masih tersimpan di browser ini.</p>
                  </div>
                </div>

                <div className="p-6 space-y-5">
                  <div className="bg-cyan-50 border border-cyan-200 rounded-xl p-4 space-y-2 text-sm">
                    <div className="flex justify-between">
                      <span className="text-slate-500">Nama Peserta:</span>
                      <span className="font-bold text-slate-800">{savedSessionData.studentInfo.nama}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Kelas:</span>
                      <span className="font-bold text-slate-800">{savedSessionData.studentInfo.kelas}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Progres Jawaban:</span>
                      <span className="font-bold text-emerald-700">
                        {answeredCount} / {savedSessionData.questions.length} Soal Terjawab
                      </span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Sisa Waktu:</span>
                      <span className="font-mono font-bold text-blue-700">{formatTime(savedSessionData.timeLeft)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Pelanggaran Tercatat:</span>
                      <span className="font-bold text-rose-600">{savedSessionData.violations || 0} / 2</span>
                    </div>
                  </div>

                  <div className="flex flex-col gap-3">
                    <button
                      type="button"
                      onClick={handleResumeSession}
                      className="w-full py-3 px-5 rounded-xl font-bold text-white bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-700 hover:to-blue-800 shadow-lg transition flex items-center justify-center gap-2"
                    >
                      <Icon name="check" className="w-5 h-5" />
                      <span>Lanjutkan Ujian</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setConfirmModal({ isOpen: true, type: "reset" })}
                      className="w-full py-2.5 px-5 rounded-xl font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 transition text-sm"
                    >
                      Mulai Ulang (Hapus Progres)
                    </button>
                  </div>
                </div>
              </div>
            </main>

            <ConfirmModal
              isOpen={confirmModal.isOpen && confirmModal.type === "reset"}
              title="Hapus Progres Tersimpan?"
              message="Seluruh jawaban dan sisa waktu pada sesi sebelumnya akan dihapus permanen. Anda akan memulai ujian baru dari awal."
              confirmText="Ya, Hapus & Mulai Baru"
              cancelText="Batal"
              onConfirm={handleResetSavedSession}
              onCancel={() => setConfirmModal({ isOpen: false, type: "submit" })}
            />
          </div>
        );
      }

      // =======================================================================
      // TAMPILAN 2: HALAMAN LOGIN PESERTA UJIAN
      // =======================================================================
      if (screen === "login") {
        return (
          <div className="min-h-screen flex flex-col">
            {renderHeader(false)}
            <main className="flex-1 flex items-center justify-center p-4 sm:p-6">
              <div className="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl max-w-xl w-full overflow-hidden border border-white/50">
                <div className="bg-gradient-to-r from-cyan-700 to-blue-800 px-6 py-5 text-white">
                  <div className="flex items-center gap-2.5">
                    <Icon name="user" className="w-6 h-6 text-cyan-200" />
                    <h2 className="text-lg sm:text-xl font-bold">Identitas Peserta Ujian</h2>
                  </div>
                  <p className="text-xs sm:text-sm text-cyan-100 mt-1">
                    Silakan lengkapi data diri Anda dengan benar sebelum memulai ujian.
                  </p>
                </div>

                <form onSubmit={handleStartNewExam} className="p-6 sm:p-8 space-y-5">
                  {loginError && (
                    <div className="p-3.5 rounded-xl bg-red-50 border border-red-300 text-red-700 text-sm flex items-center gap-2">
                      <Icon name="alert" className="w-5 h-5 flex-shrink-0" />
                      <span>{loginError}</span>
                    </div>
                  )}

                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1.5">
                      Nama Lengkap Siswa <span className="text-red-500">*</span>
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="Masukkan nama lengkap sesuai absensi..."
                      value={studentInfo.nama}
                      onChange={(e) => setStudentInfo({ ...studentInfo, nama: e.target.value })}
                      className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-cyan-600 focus:ring-4 focus:ring-cyan-500/20 outline-none transition text-slate-800 font-medium"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-1.5">
                        Kelas <span className="text-red-500">*</span>
                      </label>
                      <input
                        type="text"
                        required
                        placeholder="Contoh: VIII-A"
                        value={studentInfo.kelas}
                        onChange={(e) => setStudentInfo({ ...studentInfo, kelas: e.target.value })}
                        className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-cyan-600 focus:ring-4 focus:ring-cyan-500/20 outline-none transition text-slate-800 font-medium"
                      />
                    </div>

                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-1.5">
                        Tanggal Ujian <span className="text-red-500">*</span>
                      </label>
                      <input
                        type="date"
                        required
                        value={studentInfo.tanggal}
                        onChange={(e) => setStudentInfo({ ...studentInfo, tanggal: e.target.value })}
                        className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-cyan-600 focus:ring-4 focus:ring-cyan-500/20 outline-none transition text-slate-800 font-medium"
                      />
                    </div>
                  </div>

                  {/* Aturan Ujian & Keterangan Penilaian Guru */}
                  <div className="bg-sky-50 border border-sky-200 rounded-xl p-4 space-y-2 text-xs sm:text-sm text-slate-700">
                    <p className="font-bold text-sky-900 flex items-center gap-1.5">
                      <Icon name="shield" className="w-4 h-4 text-sky-700" />
                      <span>Ketentuan Ujian CBT:</span>
                    </p>
                    <ul className="list-disc pl-5 space-y-1 text-slate-600">
                      <li>Durasi pengerjaan adalah <strong>{EXAM_CONFIG.durationMinutes} Menit</strong> untuk <strong>40 soal</strong> (30 Pilihan Ganda, 5 Isian Singkat, 5 Esai).</li>
                      <li>Untuk soal <strong>Isian Singkat dan Esai/Uraian akan diperiksa langsung oleh guru</strong>.</li>
                      <li>Sistem berjalan dalam mode <strong>Fullscreen</strong>. Keluar dari layar penuh atau berpindah tab sebanyak 2 kali akan mengunci ujian otomatis.</li>
                    </ul>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3.5 px-6 rounded-xl font-bold text-white text-base bg-gradient-to-r from-cyan-600 via-sky-600 to-blue-700 hover:from-cyan-700 hover:to-blue-800 shadow-lg hover:shadow-xl transition transform active:scale-[0.99] flex items-center justify-center gap-2"
                  >
                    <span>Mulai Ujian</span>
                    <Icon name="chevronRight" className="w-5 h-5" />
                  </button>
                </form>
              </div>
            </main>
          </div>
        );
      }

      // =======================================================================
      // TAMPILAN 3: HALAMAN NILAI / SELESAI UJIAN
      // =======================================================================
      if (screen === "finished" && examResult) {
        return (
          <div className="min-h-screen flex flex-col">
            {renderHeader(false)}
            <main className="flex-1 flex items-center justify-center p-4 sm:p-6">
              <div className="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden border border-white/60">
                <div className="bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-700 px-6 py-6 text-white text-center">
                  <div className="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-3 border border-white/30">
                    <Icon name="check" className="w-10 h-10 text-white" />
                  </div>
                  <h2 className="text-2xl font-extrabold">Ujian Telah Dikumpulkan!</h2>
                  <p className="text-sm text-emerald-100 mt-1">{examResult.serverStatus}</p>
                </div>

                <div className="p-6 sm:p-8 space-y-6">
                  {/* Identitas Peserta */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm">
                    <div>
                      <span className="text-xs text-slate-500 block">Nama Peserta</span>
                      <span className="font-bold text-slate-800">{examResult.studentInfo.nama}</span>
                    </div>
                    <div>
                      <span className="text-xs text-slate-500 block">Kelas</span>
                      <span className="font-bold text-slate-800">{examResult.studentInfo.kelas}</span>
                    </div>
                    <div>
                      <span className="text-xs text-slate-500 block">Tanggal Ujian</span>
                      <span className="font-bold text-slate-800">{examResult.studentInfo.tanggal}</span>
                    </div>
                  </div>

                  {/* Kartu Skor Pilihan Ganda & Status Koreksi Guru */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="bg-gradient-to-br from-cyan-50 to-blue-50 border border-cyan-200 rounded-2xl p-5 text-center">
                      <span className="text-xs font-bold uppercase tracking-wider text-cyan-800">
                        Skor Pilihan Ganda (Otomatis)
                      </span>
                      <div className="text-4xl font-black text-blue-800 my-2">
                        {examResult.pgPointsEarned} <span className="text-lg font-bold text-slate-500">/ {examResult.pgPointsMax}</span>
                      </div>
                      <p className="text-xs text-slate-600">
                        Benar <strong>{examResult.pgCorrect}</strong> dari <strong>{examResult.pgTotal}</strong> soal PG (Skala PG: <strong>{examResult.pgScoreScale100}/100</strong>)
                      </p>
                    </div>

                    <div className="bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200 rounded-2xl p-5 flex flex-col justify-center">
                      <div className="flex items-center gap-2 text-amber-800 font-bold text-sm mb-1.5">
                        <Icon name="edit" className="w-5 h-5 text-amber-600 flex-shrink-0" />
                        <span>Isian & Esai Diperiksa Guru</span>
                      </div>
                      <p className="text-xs text-slate-700 leading-relaxed">
                        Sebanyak <strong>{examResult.manualAnsweredCount}</strong> dari <strong>{examResult.shortCount + examResult.essayCount}</strong> soal Isian Singkat & Esai telah terekam dan <strong>akan diperiksa langsung oleh guru</strong> untuk melengkapi nilai akhir (maksimal 40 poin tambahan).
                      </p>
                    </div>
                  </div>

                  {/* Ringkasan Status */}
                  <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 text-xs sm:text-sm space-y-1.5 text-slate-600">
                    <div className="flex justify-between">
                      <span>Keterangan Selesai:</span>
                      <span className="font-semibold text-slate-800">{examResult.completionReason}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Catatan Pelanggaran:</span>
                      <span className={`font-semibold ${examResult.violations > 0 ? "text-red-600" : "text-emerald-700"}`}>
                        {examResult.violations} Kali
                      </span>
                    </div>
                  </div>

                  <div className="text-center pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        isSubmittingRef.current = false;
                        setExamResult(null);
                        setStudentInfo({ nama: "", kelas: "", tanggal: getTodayDateString() });
                        setScreen("login");
                      }}
                      className="px-6 py-3 rounded-xl font-bold text-white bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-700 hover:to-blue-800 shadow-md transition"
                    >
                      Selesai & Kembali ke Halaman Awal
                    </button>
                  </div>
                </div>
              </div>
            </main>
          </div>
        );
      }

      // =======================================================================
      // TAMPILAN 4: ANTARMUKA UJIAN UTAMA (EXAM UI)
      // =======================================================================
      const currentQuestion = questions[currentIndex];
      const totalQuestions = questions.length;
      const answeredTotal = questions.filter((q) => isQuestionAnswered(q, answers[q.id])).length;
      const unansweredTotal = totalQuestions - answeredTotal;

      const getQuestionTypeBadge = (q) => {
        if (q.type === "mc") {
          return (
            <span className="px-3 py-1 rounded-full text-xs font-bold bg-cyan-100 text-cyan-800 border border-cyan-200">
              Pilihan Ganda
            </span>
          );
        }
        if (q.type === "mc_complex") {
          return (
            <span className="px-3 py-1 rounded-full text-xs font-bold bg-indigo-100 text-indigo-800 border border-indigo-200">
              Pilihan Ganda Kompleks
            </span>
          );
        }
        if (q.type === "short") {
          return (
            <div className="flex flex-wrap items-center gap-2">
              <span className="px-3 py-1 rounded-full text-xs font-bold bg-teal-100 text-teal-800 border border-teal-200">
                Isian Singkat
              </span>
              <span className="px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-300">
                Diperiksa Langsung oleh Guru
              </span>
            </div>
          );
        }
        return (
          <div className="flex flex-wrap items-center gap-2">
            <span className="px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-800 border border-blue-200">
              Uraian / Esai
            </span>
            <span className="px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-300">
              Diperiksa Langsung oleh Guru
            </span>
          </div>
        );
      };

      return (
        <div className="min-h-screen flex flex-col bg-gradient-to-br from-cyan-50 via-sky-100 to-blue-200 no-select">
          {renderHeader(true)}

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            {/* KOLOM KIRI / TENGAH: AREA SOAL & OPSI JAWABAN */}
            <section className="lg:col-span-8 bg-white rounded-2xl shadow-xl border border-cyan-100 overflow-hidden flex flex-col">
              {/* Header Kartu Soal */}
              <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <span className="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-600 to-blue-700 text-white font-extrabold flex items-center justify-center shadow-sm">
                    {currentIndex + 1}
                  </span>
                  <span className="font-bold text-slate-700 text-sm sm:text-base">
                    Soal Nomor {currentIndex + 1} dari {totalQuestions}
                  </span>
                </div>
                {currentQuestion && getQuestionTypeBadge(currentQuestion)}
              </div>

              {/* Isi Soal & Input Jawaban */}
              {currentQuestion && (
                <div className="p-6 sm:p-8 flex-1">
                  {/* Tampilkan Gambar Jika Soal Memiliki Properti Image */}
                  {currentQuestion.image && (
                    <div className="mb-5 rounded-xl overflow-hidden border border-slate-200 bg-slate-50 p-2">
                      <img
                        src={currentQuestion.image}
                        alt={`Ilustrasi Soal Nomor ${currentQuestion.id}`}
                        className="w-full max-h-72 object-contain mx-auto rounded-lg"
                      />
                    </div>
                  )}

                  {/* Teks Stimulus & Pertanyaan */}
                  <div
                    className="text-slate-800 text-base sm:text-[17px] leading-relaxed mb-6"
                    dangerouslySetInnerHTML={{ __html: currentQuestion.question }}
                  />

                  {/* Opsi Pilihan Ganda Biasa */}
                  {currentQuestion.type === "mc" && (
                    <div className="space-y-3">
                      {currentQuestion.options.map((opt, idx) => {
                        const displayLetter = ["A", "B", "C", "D", "E"][idx] || opt.key;
                        const isSelected = answers[currentQuestion.id] === opt.key;

                        return (
                          <button
                            key={opt.key}
                            type="button"
                            onClick={() => handleAnswerChange(currentQuestion.id, opt.key)}
                            className={`w-full text-left p-4 rounded-xl border-2 transition flex items-start gap-3.5 ${
                              isSelected
                                ? "bg-cyan-50/90 border-cyan-600 shadow-md ring-2 ring-cyan-500/20"
                                : "bg-white border-slate-200 hover:border-cyan-400 hover:bg-slate-50"
                            }`}
                          >
                            <span
                              className={`w-8 h-8 rounded-lg font-bold text-sm flex items-center justify-center flex-shrink-0 transition ${
                                isSelected
                                  ? "bg-cyan-600 text-white"
                                  : "bg-slate-100 text-slate-700 border border-slate-300"
                              }`}
                            >
                              {displayLetter}
                            </span>
                            <span className="text-slate-800 text-sm sm:text-base leading-relaxed pt-1">
                              {opt.text}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  )}

                  {/* Opsi Pilihan Ganda Kompleks (Jika Ada) */}
                  {currentQuestion.type === "mc_complex" && (
                    <div className="space-y-3">
                      <p className="text-xs font-semibold text-indigo-700 mb-2">
                        * Pilih lebih dari satu jawaban yang benar (contreng kotak pilihan).
                      </p>
                      {currentQuestion.options.map((opt) => {
                        const selectedArr = Array.isArray(answers[currentQuestion.id])
                          ? answers[currentQuestion.id]
                          : [];
                        const isChecked = selectedArr.includes(opt.key);

                        return (
                          <button
                            key={opt.key}
                            type="button"
                            onClick={() => handleComplexToggle(currentQuestion.id, opt.key)}
                            className={`w-full text-left p-4 rounded-xl border-2 transition flex items-start gap-3.5 ${
                              isChecked
                                ? "bg-indigo-50 border-indigo-600 shadow-md"
                                : "bg-white border-slate-200 hover:border-indigo-400 hover:bg-slate-50"
                            }`}
                          >
                            <span
                              className={`w-6 h-6 rounded-md flex items-center justify-center flex-shrink-0 mt-0.5 border-2 font-bold text-xs ${
                                isChecked
                                  ? "bg-indigo-600 border-indigo-600 text-white"
                                  : "bg-white border-slate-400 text-transparent"
                              }`}
                            >
                              ✓
                            </span>
                            <span className="text-slate-800 text-sm sm:text-base leading-relaxed">
                              {opt.text}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  )}

                  {/* Kotak Jawaban Isian Singkat */}
                  {currentQuestion.type === "short" && (
                    <div className="space-y-3">
                      <div className="p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs sm:text-sm flex items-center gap-2">
                        <Icon name="edit" className="w-4 h-4 text-amber-600 flex-shrink-0" />
                        <span>Catatan: Jawaban isian singkat ini akan disimpan dan <strong>diperiksa langsung oleh guru</strong>.</span>
                      </div>
                      <label className="block text-sm font-bold text-slate-700">
                        Ketik Jawaban Singkat Anda:
                      </label>
                      <input
                        type="text"
                        placeholder="Tuliskan jawaban singkat dengan ejaan yang tepat..."
                        value={answers[currentQuestion.id] || ""}
                        onChange={(e) => handleAnswerChange(currentQuestion.id, e.target.value)}
                        className="w-full px-4 py-3.5 rounded-xl border-2 border-slate-300 focus:border-cyan-600 focus:ring-4 focus:ring-cyan-500/20 outline-none text-slate-800 font-medium text-base"
                      />
                    </div>
                  )}

                  {/* Kotak Jawaban Uraian / Esai */}
                  {currentQuestion.type === "essay" && (
                    <div className="space-y-3">
                      <div className="p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs sm:text-sm flex items-center gap-2">
                        <Icon name="edit" className="w-4 h-4 text-amber-600 flex-shrink-0" />
                        <span>Catatan: Jawaban uraian/esai ini akan disimpan lengkap dan <strong>diperiksa langsung oleh guru</strong>.</span>
                      </div>
                      <label className="block text-sm font-bold text-slate-700">
                        Tuliskan Jawaban Uraian Anda Secara Lengkap:
                      </label>
                      <textarea
                        rows={6}
                        placeholder="Tuliskan penjelasan atau jawaban uraian Anda dengan jelas dan lengkap..."
                        value={answers[currentQuestion.id] || ""}
                        onChange={(e) => handleAnswerChange(currentQuestion.id, e.target.value)}
                        className="w-full px-4 py-3.5 rounded-xl border-2 border-slate-300 focus:border-cyan-600 focus:ring-4 focus:ring-cyan-500/20 outline-none text-slate-800 text-base leading-relaxed"
                      />
                    </div>
                  )}
                </div>
              )}

              {/* Footer Navigasi Sebelumnya / Selanjutnya / Selesai & Kumpulkan */}
              <div className="bg-slate-50 px-6 py-4 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
                <button
                  type="button"
                  disabled={currentIndex === 0}
                  onClick={() => setCurrentIndex((prev) => Math.max(0, prev - 1))}
                  className={`px-5 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2 transition ${
                    currentIndex === 0
                      ? "bg-slate-200 text-slate-400 cursor-not-allowed"
                      : "bg-white text-slate-700 border border-slate-300 hover:bg-slate-100 shadow-sm active:scale-95"
                  }`}
                >
                  <Icon name="chevronLeft" className="w-4 h-4" />
                  <span>Sebelumnya</span>
                </button>

                <div className="flex items-center gap-3">
                  {currentIndex < totalQuestions - 1 ? (
                    <button
                      type="button"
                      onClick={() => setCurrentIndex((prev) => Math.min(totalQuestions - 1, prev + 1))}
                      className="px-6 py-2.5 rounded-xl font-bold text-sm text-white bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-700 hover:to-blue-800 shadow-md flex items-center gap-2 transition active:scale-95"
                    >
                      <span>Selanjutnya</span>
                      <Icon name="chevronRight" className="w-4 h-4" />
                    </button>
                  ) : (
                    <button
                      type="button"
                      disabled={isSubmitting}
                      onClick={openSubmitConfirmation}
                      className="px-6 py-2.5 rounded-xl font-bold text-sm text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 shadow-lg flex items-center gap-2 transition active:scale-95"
                    >
                      <Icon name="send" className="w-4 h-4" />
                      <span>{isSubmitting ? "Mengirim..." : "Selesai & Kumpulkan"}</span>
                    </button>
                  )}
                </div>
              </div>
            </section>

            {/* KOLOM KANAN / BAWAH: NAVIGASI KOTAK NOMOR SOAL */}
            <aside className="lg:col-span-4 bg-white rounded-2xl shadow-xl border border-cyan-100 overflow-hidden">
              <div className="bg-gradient-to-r from-cyan-700 to-blue-800 px-5 py-4 text-white">
                <h3 className="font-bold text-base">Navigasi Nomor Soal</h3>
                <p className="text-xs text-cyan-100 mt-0.5">
                  Terjawab: <strong>{answeredTotal}</strong> &bull; Belum: <strong>{unansweredTotal}</strong>
                </p>
              </div>

              <div className="p-5">
                <div className="grid grid-cols-5 sm:grid-cols-8 lg:grid-cols-5 gap-2.5">
                  {questions.map((q, idx) => {
                    const answered = isQuestionAnswered(q, answers[q.id]);
                    const isActive = idx === currentIndex;

                    return (
                      <button
                        key={q.id}
                        type="button"
                        onClick={() => setCurrentIndex(idx)}
                        className={`h-11 rounded-xl font-bold text-sm border transition flex items-center justify-center relative ${
                          answered
                            ? "bg-emerald-500 text-white border-emerald-600 hover:bg-emerald-600"
                            : "bg-slate-100 text-slate-700 border-slate-300 hover:bg-slate-200"
                        } ${isActive ? "ring-4 ring-blue-500 ring-offset-1 z-10" : ""}`}
                        title={`Soal ${idx + 1} (${answered ? "Sudah Dijawab" : "Belum Dijawab"})`}
                      >
                        {idx + 1}
                      </button>
                    );
                  })}
                </div>

                {/* Legenda Status Kotak Nomor */}
                <div className="mt-5 pt-4 border-t border-slate-200 space-y-2 text-xs text-slate-600">
                  <div className="flex items-center gap-2.5">
                    <span className="w-5 h-5 rounded-md bg-emerald-500 border border-emerald-600 inline-block"></span>
                    <span>Hijau: Soal sudah dijawab</span>
                  </div>
                  <div className="flex items-center gap-2.5">
                    <span className="w-5 h-5 rounded-md bg-slate-100 border border-slate-300 inline-block"></span>
                    <span>Putih / Abu-abu: Belum dijawab</span>
                  </div>
                  <div className="flex items-center gap-2.5">
                    <span className="w-5 h-5 rounded-md bg-white border border-slate-300 ring-2 ring-blue-500 inline-block"></span>
                    <span>Garis tepi biru: Soal sedang aktif dibuka</span>
                  </div>
                </div>

                {/* Info Pemeriksaan Guru */}
                <div className="mt-4 p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-900 leading-relaxed">
                  <strong>Info Penilaian:</strong> Pilihan Ganda dinilai otomatis oleh sistem, sedangkan <strong>Isian Singkat dan Esai akan diperiksa langsung oleh guru</strong>.
                </div>
              </div>
            </aside>
          </main>

          {/* CUSTOM MODALS (ANTI-FLICKER) */}
          <AlertModal
            isOpen={alertModal.isOpen}
            title={alertModal.title}
            message={alertModal.message}
            buttonText={alertModal.buttonText}
            variant={alertModal.variant}
            onClose={handleCloseAlertModal}
          />

          <ConfirmModal
            isOpen={confirmModal.isOpen && confirmModal.type === "submit"}
            title="Konfirmasi Pengumpulan Ujian"
            message="Apakah Anda yakin ingin mengakhiri ujian dan mengirimkan seluruh jawaban Anda sekarang? Jawaban tidak dapat diubah setelah dikumpulkan."
            unansweredCount={unansweredTotal}
            onConfirm={() => finalizeAndSubmitExam("Selesai Normal (Dikumpulkan Siswa)")}
            onCancel={() => setConfirmModal({ isOpen: false, type: "submit" })}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
